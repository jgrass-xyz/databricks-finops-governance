resources:
  jobs:
    asset_governance_refresh:
      name: databricks-finops-governance | asset_governance_refresh
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: America/Los_Angeles
        # Enable only after validating the initial backfill cost in your workspace.
        pause_status: PAUSED
      tasks:
        # Notebook tasks without a cluster declaration run on serverless jobs compute.
        - task_key: setup
          notebook_task:
            notebook_path: ../src/governance/00_setup.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: inventory
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ../src/governance/01_inventory.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: cost_rollup
          depends_on:
            - task_key: inventory
          notebook_task:
            notebook_path: ../src/governance/02_cost_rollup.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              correction_lookback_days: ${var.governance_cost_lookback_days}
              initial_backfill_days: ${var.governance_cost_initial_backfill_days}
        - task_key: visibility
          depends_on:
            - task_key: cost_rollup
          notebook_task:
            notebook_path: ../src/governance/03_visibility.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              billing_tag_key: ${var.visibility_billing_tag_key}
              account_id: ${var.visibility_account_id}

    governance_schema_smoke_test:
      name: databricks-finops-governance | governance_schema_smoke_test
      max_concurrent_runs: 1
      tasks:
        - task_key: cleanup_before
          notebook_task:
            notebook_path: ../src/governance/99_cleanup.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.governance_schema_test_schema}
              confirm: DROP ${var.catalog}.${var.governance_schema_test_schema}
        - task_key: setup
          depends_on:
            - task_key: cleanup_before
          notebook_task:
            notebook_path: ../src/governance/00_setup.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.governance_schema_test_schema}
        - task_key: assert_schema
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ../src/governance/04_schema_smoke_test.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.governance_schema_test_schema}
        - task_key: cleanup_after
          depends_on:
            - task_key: cleanup_before
            - task_key: setup
            - task_key: assert_schema
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../src/governance/99_cleanup.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.governance_schema_test_schema}
              confirm: DROP ${var.catalog}.${var.governance_schema_test_schema}
